id = "cedrus.sidebar-numbers"
name = "Sidebar Numbers"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Publish workspace/agent positions as a `num` metadata token so the sidebar can show them as $num."
platforms = ["macos", "linux"]

# Metadata tokens are runtime-only -- herdr's session.json does not persist
# them, so a restarted server comes back with an unnumbered sidebar.
[[startup]]
command = ["bun", "number-sidebar.js"]

[[actions]]
id = "sync"
title = "Renumber sidebar"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "number-sidebar.js"]

# Events that can actually renumber a row, plus (see tab.focused below) events
# that change a row's *content* without moving it. Most focus/status events are
# still deliberately absent: they fire constantly and neither renumber nor
# change content here. Every event below was verified to fire on 0.7.5 unless
# noted -- being accepted by the manifest parser is not the same as delivered.
[[events]]
on = "workspace.created"
command = ["bun", "number-sidebar.js"]

[[events]]
on = "workspace.closed"
command = ["bun", "number-sidebar.js"]

[[events]]
on = "workspace.moved"
command = ["bun", "number-sidebar.js"]

# herdr 0.8.0's atomic worktree-group reordering (workspace.move_block) fires
# this instead of one workspace.moved per member. Confirmed both accepted by
# the manifest parser (0.7.5 rejected it: it didn't exist yet) and delivered
# live (dragging a worktree group invoked the plugin). min_herdr_version
# bumped to 0.8.0 because of this line.
[[events]]
on = "workspace.reordered"
command = ["bun", "number-sidebar.js"]

# Agents follow tab order within a workspace, so a tab reorder shifts them.
[[events]]
on = "tab.moved"
command = ["bun", "number-sidebar.js"]

[[events]]
on = "pane.closed"
command = ["bun", "number-sidebar.js"]

[[events]]
on = "pane.moved"
command = ["bun", "number-sidebar.js"]

# An agent's process exits -> it leaves the agent list -> everything after shifts.
[[events]]
on = "pane.exited"
command = ["bun", "number-sidebar.js"]

# ...and the reverse: a pane becomes an agent and joins the list.
# `pane.created` is NOT subscribed -- a fresh pane hosts no agent yet.
[[events]]
on = "pane.agent_detected"
command = ["bun", "number-sidebar.js"]

# Doesn't renumber anything -- it's what changes a workspace's active_tab_id,
# which `tab_cwd` reads. `workspace.focused` (global cursor) stays unsubscribed;
# this is the per-workspace "last tab you looked at in here" signal instead.
[[events]]
on = "tab.focused"
command = ["bun", "number-sidebar.js"]
